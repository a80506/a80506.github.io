            cursor: move;
            user-select: none;

            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .event-pulse {
            position: relative;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #ff4757;
            box-shadow: 0 0 8px #ff4757;
        }

        .event-pulse::after {
            content: "";
            position: absolute;
            inset: -5px;
            border: 1px solid rgba(255, 71, 87, 0.5);
            border-radius: 50%;
            animation: event-pulse 1.8s ease-out infinite;
        }

        @keyframes event-pulse {
            from {
                transform: scale(0.65);
                opacity: 1;
            }
            to {
                transform: scale(1.7);
                opacity: 0;
            }
        }

        .event-actions {

            gap: 8px;

        .market-float {

        .market-float.is-visible {

        const features = [
            'width=' + width,
            'height=' + height,
            'left=' + left,
            'top=' + top,
            'scrollbars=yes',
            'resizable=yes'
        ].join(',');

    function updateClockEvent() {
        const now = new Date();
        const day = now.getDay();
        const minutes = now.getHours() * 60 + now.getMinutes();
        const isWeekday = day >= 1 && day <= 5;
        const isClosingSoon = minutes >= (13 * 60 + 10) && minutes <= (13 * 60 + 29);
        const isLunchOrderDay = day === 1 || day === 3 || day === 5;
        const isLunchOrderTime = minutes >= (12 * 60) && minutes <= (12 * 60 + 15);
        const events = [];

        if (isLunchOrderDay && isLunchOrderTime) {
            events.push('買便當');
        }
        if (isWeekday && isClosingSoon) {
            events.push('即將收盤');
        }

        updateEventGroup('clock', events);
    }

    function getLocalDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
    }

    function extractTimeMinutes(text) {
        if (!text) {
            return null;
        }
        // "12:25 還書" / "8月5日12:25" / "5 Aug 20:00"
        const match = String(text).match(/(\d{1,2}):(\d{2})\b/);
        if (!match) {
            return null;
        }
        const hour = parseInt(match[1], 10);
        const minute = parseInt(match[2], 10);
        if (hour > 23 || minute > 59) {
            return null;
        }
        return hour * 60 + minute;
    }

    function formatMinutesAsTime(minutes) {
        const hour = String(Math.floor(minutes / 60)).padStart(2, '0');
        const minute = String(minutes % 60).padStart(2, '0');
        return hour + ':' + minute;
    }

    function getTodoistTaskTimeMinutes(task) {
        if (task.due_datetime) {
            const due = new Date(task.due_datetime);
            if (!isNaN(due.getTime())) {
                return due.getHours() * 60 + due.getMinutes();
            }
        }

        // content / due_string 內的時間（例如 "8月5日12:25"）
        const fromContent = extractTimeMinutes(task.content);
        if (fromContent !== null) {
            return fromContent;
        }
        return extractTimeMinutes(task.due_string);
    }

    // json 的 is_overdue 常只標「跨日」；今天已過鐘點也視為過期
    function isTodoistTaskOverdue(task, now) {
        if (task.is_overdue) {
            return true;
        }

        const dueDate = task.due_date ? String(task.due_date).slice(0, 10) : '';
        if (!dueDate) {
            return false;
        }

        const todayKey = getLocalDateKey(now);
        if (dueDate < todayKey) {
            return true;
        }
        if (dueDate > todayKey) {
            return false;
        }

        const timeMinutes = getTodoistTaskTimeMinutes(task);
        if (timeMinutes === null) {
            return false; // 今天全天任務，未到隔日不算過期
        }

        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        return nowMinutes >= timeMinutes;
    }

    function taskToTodoistEvent(task, now) {
        const content = task.content || '';
        const isOverdue = isTodoistTaskOverdue(task, now);
        const timeMinutes = getTodoistTaskTimeMinutes(task);
        let title = content;

        // content 沒帶時間時，從 due_string 補上，例如 "12:25 還書"
        if (timeMinutes !== null && !extractTimeMinutes(content)) {
            title = formatMinutesAsTime(timeMinutes) + ' ' + content;
        }
        if (isOverdue) {
            title = '[過期] ' + title;
        }

        const event = {
            title: title,
            tone: isOverdue ? 'overdue' : 'todoist',
            popup: true,
            isOverdue: isOverdue,
            timeMinutes: timeMinutes
        };
        // json 的 url 多半為 null，改用 task id 組 Todoist 任務頁
        if (task.url) {
            event.url = task.url;
        } else if (task.id) {
            event.url = 'https://app.todoist.com/app/task/' + encodeURIComponent(task.id);
        }
        return event;
    }

            }

            const data = await response.json();
            // 優先用分好的陣列；過期在前、今天有時間的在後
            let tasks = [];
            if (Array.isArray(data.overdue_tasks) || Array.isArray(data.today_tasks)) {
                tasks = (data.overdue_tasks || []).concat(data.today_tasks || []);
            } else if (Array.isArray(data.tasks)) {
                tasks = data.tasks.slice();
            }

            const now = new Date();
            const events = tasks.map(function (task) {
                return taskToTodoistEvent(task, now);
            });

            events.sort(function (a, b) {
                if (!!a.isOverdue !== !!b.isOverdue) {
                    return a.isOverdue ? -1 : 1; // 過期在上
                }

                const aHasTime = a.timeMinutes !== null && a.timeMinutes !== undefined;
                const bHasTime = b.timeMinutes !== null && b.timeMinutes !== undefined;
                if (aHasTime !== bHasTime) {
                    return aHasTime ? -1 : 1; // 有時間的排在無時間上方
                }
                if (aHasTime && bHasTime && a.timeMinutes !== b.timeMinutes) {
                    return a.timeMinutes - b.timeMinutes; // 時間早的在上
                }
                return 0;
            });

            updateEventGroup('todoist', events);
        } catch (error) {
            updateEventGroup('todoist', []);
            console.error('Todoist event fetch error:', error);
        }
    }

    function initEventFloat() {
        const panel = document.getElementById('eventFloat');
        const handle = document.getElementById('eventDragHandle');
        const minimize = document.getElementById('eventMinimize');
        let dragStart = null;

        bindEventPopupLinks();
        renderActiveEvents();

        try {
            const savedPosition = JSON.parse(localStorage.getItem('eventFloatPositionV2'));
            const isVisiblePosition = savedPosition &&
                savedPosition.left >= 0 && savedPosition.top >= 0 &&
                savedPosition.left < window.innerWidth - 60 &&
                savedPosition.top < window.innerHeight - 35;

            if (isVisiblePosition) {
                panel.style.left = savedPosition.left + 'px';
                panel.style.top = savedPosition.top + 'px';
            }

            if (localStorage.getItem('eventFloatCompact') === 'true') {
                panel.classList.add('compact');
                minimize.textContent = '+';
                minimize.setAttribute('aria-expanded', 'false');
            }
        } catch (error) {
            // Keep the default position when local storage is unavailable.
        }

        minimize.addEventListener('pointerdown', function (event) {
            event.stopPropagation();
        });

        minimize.addEventListener('click', function () {
            const compact = panel.classList.toggle('compact');
            minimize.textContent = compact ? '+' : '−';
            minimize.setAttribute('aria-expanded', compact ? 'false' : 'true');
            try {
                localStorage.setItem('eventFloatCompact', compact);
            } catch (error) {
                // The control remains usable without persistence.
            }
        });

        handle.addEventListener('pointerdown', function (event) {
            if (event.target.closest('button')) {
                return;
            }

            const rect = panel.getBoundingClientRect();
            dragStart = {
                pointerId: event.pointerId,
                x: event.clientX,
                y: event.clientY,
                left: rect.left,
                top: rect.top
            };
            panel.style.left = rect.left + 'px';
            panel.style.top = rect.top + 'px';
            panel.classList.add('dragging');
            handle.setPointerCapture(event.pointerId);
        });

        handle.addEventListener('pointermove', function (event) {
            if (!dragStart || dragStart.pointerId !== event.pointerId) {
                return;
            }

            const maxLeft = Math.max(8, window.innerWidth - panel.offsetWidth - 8);
            const maxTop = Math.max(8, window.innerHeight - panel.offsetHeight - 8);
            const left = Math.min(maxLeft, Math.max(8, dragStart.left + event.clientX - dragStart.x));
            const top = Math.min(maxTop, Math.max(8, dragStart.top + event.clientY - dragStart.y));
            panel.style.left = left + 'px';
            panel.style.top = top + 'px';
        });

        function finishEventDrag(event) {
            if (!dragStart || dragStart.pointerId !== event.pointerId) {
                return;
            }

            panel.classList.remove('dragging');
            handle.releasePointerCapture(event.pointerId);
            dragStart = null;
            try {
                localStorage.setItem('eventFloatPositionV2', JSON.stringify({
                    left: panel.offsetLeft,
                    top: panel.offsetTop
                }));
            } catch (error) {
                // The dragged position is still applied for this session.
            }
        }

        handle.addEventListener('pointerup', finishEventDrag);
        handle.addEventListener('pointercancel', finishEventDrag);
    }

    function stripUsdtSuffix(text) {
        return String(text || '').replace(/USDT$/i, '');
    }

    function marketBreakoutLabel(item) {
        if (item.name) {
            return stripUsdtSuffix(item.name);
        }
        return stripUsdtSuffix(item.symbol);
    }

    // 從單一 payload 收集指定 kind 的 breakout
    function collectMarketBreakoutsByKind(payload, kind) {
        const alerts = (payload && payload.alerts && payload.alerts.breakouts) || [];
        const type = kind === 'high' ? 'up_over_high' : 'down_over_low';
        const rows = [];
        alerts.forEach(function (item) {
            if (item.type !== type) {
                return;
            }
            const days = parseInt(item.days, 10);
            if (isNaN(days) || days <= 0) {
                return;
            }
            rows.push({
                name: marketBreakoutLabel(item),
                days: days,
                kind: kind
            });
        });
        return rows;
    }

    function mergeAndSortBreakouts(coinPayload, stockPayload, kind) {
        const rows = collectMarketBreakoutsByKind(coinPayload, kind)
            .concat(collectMarketBreakoutsByKind(stockPayload, kind));
        // 天數大→小；同天數幣名排前（字母）
        rows.sort(function (a, b) {
            if (a.days !== b.days) {
                return b.days - a.days;
            }
            return String(a.name).localeCompare(String(b.name));
        });
        return rows;
    }

    function renderMarketPanel(panelId, listId, titleId, rows, kindLabel) {
        const panel = document.getElementById(panelId);
        const list = document.getElementById(listId);
        const title = document.getElementById(titleId);
        if (!panel || !list) {
            return;
        }

        if (title) {
            title.textContent = kindLabel + ': ' + rows.length;
        }

        if (!rows.length) {
            panel.classList.remove('is-visible');
            panel.hidden = true;
            list.innerHTML = '';
            return;
        }

        const itemClass = kindLabel === '新高' ? 'market-item is-high' : 'market-item is-low';
        let html = '';
        rows.forEach(function (row) {
            html += `
                <article class="${itemClass}">
                    <span class="market-name">${escapeHtml(row.name)}</span>
                    <span class="market-days">${row.days}日${kindLabel}</span>
                </article>`;
        });
        list.innerHTML = html;
        panel.hidden = false;
        panel.classList.add('is-visible');
    }

    function collectVolumeExtremes(payload) {
        const alerts = (payload && payload.alerts && payload.alerts.volume_extremes) || [];
        const rows = [];
        alerts.forEach(function (item) {
            let kind = '';
            let label = '';
            if (item.type === 'volume_high_extreme') {
                kind = 'vol-high';
                label = '量高';
            } else if (item.type === 'volume_low_extreme') {
                kind = 'vol-low';
                label = '量低';
            } else {
                return;
            }
            const days = parseInt(item.days, 10);
            if (isNaN(days) || days <= 0) {
                return;
            }
            rows.push({
                name: marketBreakoutLabel(item),
                days: days,
                kind: kind,
                label: label
            });
        });
        // 量高在前、量低在後；同組天數大→小
        rows.sort(function (a, b) {
            if (a.kind !== b.kind) {
                return a.kind === 'vol-high' ? -1 : 1;
            }
            if (a.days !== b.days) {
                return b.days - a.days;
            }
            return String(a.name).localeCompare(String(b.name));
        });
        return rows;
    }

    function renderVolumePanel(rows) {
        const panel = document.getElementById('volumeFloat');
        const list = document.getElementById('volumeList');
        const title = document.getElementById('volumeTitle');
        if (!panel || !list) {
            return;
        }

        if (title) {
            title.textContent = '量: ' + rows.length;
        }

        if (!rows.length) {
            panel.classList.remove('is-visible');
            panel.hidden = true;
            list.innerHTML = '';
            return;
        }

        let html = '';
        rows.forEach(function (row) {
            const itemClass = row.kind === 'vol-high' ? 'market-item is-vol-high' : 'market-item is-vol-low';
            html += `
                <article class="${itemClass}">
                    <span class="market-name">${escapeHtml(row.name)}</span>
                    <span class="market-days">${row.days}日${row.label}</span>
                </article>`;
        });
        list.innerHTML = html;
        panel.hidden = false;
        panel.classList.add('is-visible');
    }

    async function refreshMarketBreakouts() {
        const base = 'https://' + CONFIG.MYSITE + '/linepic/';
        try {
            const responses = await Promise.all([
                fetch(base + 'coindays.json'),
                fetch(base + 'stockdays.json')
            ]);
            const payloads = await Promise.all(responses.map(function (response, index) {
                if (!response.ok) {
                    throw new Error((index === 0 ? 'coindays' : 'stockdays') + ' failed: ' + response.status);
                }
                return response.json();
            }));

            const highRows = mergeAndSortBreakouts(payloads[0], payloads[1], 'high');
            const lowRows = mergeAndSortBreakouts(payloads[0], payloads[1], 'low');
            renderMarketPanel('highFloat', 'highList', 'highTitle', highRows, '新高');
            renderMarketPanel('lowFloat', 'lowList', 'lowTitle', lowRows, '新低');
            renderVolumePanel(collectVolumeExtremes(payloads[1]));
        } catch (error) {
            renderMarketPanel('highFloat', 'highList', 'highTitle', [], '新高');
            renderMarketPanel('lowFloat', 'lowList', 'lowTitle', [], '新低');
            renderVolumePanel([]);
            console.error('Market breakout fetch error:', error);
        }
    }

    function initMarketFloat(panelId, minimizeId, storageKey) {
        const panel = document.getElementById(panelId);
        const minimize = document.getElementById(minimizeId);
        if (!panel || !minimize) {
            return;
        }

        const expandLabel = panelId === 'highFloat' ? '展開新高視窗'
            : (panelId === 'lowFloat' ? '展開新低視窗' : '展開成交量視窗');
        const collapseLabel = panelId === 'highFloat' ? '縮小新高視窗'
            : (panelId === 'lowFloat' ? '縮小新低視窗' : '縮小成交量視窗');

        // 每次載入皆預設收合
        function setCompactState(compact) {
            if (compact) {
                panel.classList.add('compact');
                minimize.textContent = '+';
                minimize.setAttribute('aria-expanded', 'false');
                minimize.setAttribute('aria-label', expandLabel);
            } else {
                panel.classList.remove('compact');
                minimize.textContent = '−';
                minimize.setAttribute('aria-expanded', 'true');
                minimize.setAttribute('aria-label', collapseLabel);
            }
            try {
                localStorage.setItem(storageKey, compact ? 'true' : 'false');
            } catch (error) {
                // ignore
            }
        }

        setCompactState(true);

        minimize.addEventListener('click', function () {
            setCompactState(!panel.classList.contains('compact'));
        });
    }

    // 依主內容左右剩餘寬度調整側邊 event：貼近內容區，勿貼螢幕最外緣
    function getMainContentRect() {
        const outer = document.querySelector('body > table');
        if (!outer) {
            return null;
        }
        // 外層 table 常是 100% 寬；取內層置中的內容表
        const inner = outer.querySelector('table');
        return (inner || outer).getBoundingClientRect();
    }

    function clampFloatWidth(spacePx) {
        // spacePx = 側邊空隙；扣掉與內容、螢幕邊緣的間距
        const edgePad = 10;
        const contentGap = 12;
        const available = Math.floor(spacePx - edgePad - contentGap);
        const minW = 100;
        const preferred = 200;
        if (available <= 0) {
            return minW;
        }
        // 空間夠就用 200，不要撐滿整條側邊（否則看起來貼邊又過寬）
        if (available >= preferred) {
            return preferred;
        }
        return Math.max(minW, available);
    }

    function updateSideFloatWidths() {
        const content = getMainContentRect();
        const leftPanels = [
            document.getElementById('eventFloat'),
            document.getElementById('highFloat')
        ];
        const rightPanels = [
            document.getElementById('lowFloat'),
            document.getElementById('volumeFloat')
        ];
        const edgePad = 10;
        const contentGap = 12;

        let leftW = 200;
        let rightW = 200;
        let leftX = 18;
        let rightX = null; // 用 left 定位右欄時的 x

        if (content && content.width > 0) {
            leftW = clampFloatWidth(content.left);
            rightW = clampFloatWidth(window.innerWidth - content.right);

            // 左側：貼在主內容左外側（往右靠，不要貼螢幕左緣）
            leftX = Math.round(content.left - contentGap - leftW);
            if (leftX < edgePad) {
                leftX = edgePad;
                // 螢幕太窄時再縮寬，避免壓到內容
                const maxLeftW = Math.max(minWSafe(), Math.floor(content.left - edgePad - contentGap));
                leftW = Math.min(leftW, maxLeftW);
                leftX = Math.max(edgePad, Math.round(content.left - contentGap - leftW));
            }

            // 右側：貼在主內容右外側（往左靠，不要貼螢幕右緣）
            rightX = Math.round(content.right + contentGap);
            const rightEdge = rightX + rightW;
            if (rightEdge > window.innerWidth - edgePad) {
                const maxRightW = Math.max(minWSafe(), Math.floor(window.innerWidth - edgePad - content.right - contentGap));
                rightW = Math.min(rightW, maxRightW);
                rightX = Math.round(content.right + contentGap);
            }
        }

        function minWSafe() {
            return 100;
        }

        leftPanels.forEach(function (el) {
            if (!el) {
                return;
            }
            el.style.width = leftW + 'px';
            el.style.left = leftX + 'px';
            el.style.right = 'auto';
        });
        rightPanels.forEach(function (el) {
            if (!el) {
                return;
            }
            el.style.width = rightW + 'px';
            if (rightX !== null) {
                el.style.left = rightX + 'px';
                el.style.right = 'auto';
            } else {
                el.style.right = '18px';
                el.style.left = 'auto';
            }
        });
    }

    let floatWidthResizeTimer = null;
    function scheduleSideFloatWidthUpdate() {
        if (floatWidthResizeTimer) {
            clearTimeout(floatWidthResizeTimer);
        }
        floatWidthResizeTimer = setTimeout(updateSideFloatWidths, 80);
    }

    initEventFloat();
    initMarketFloat('highFloat', 'highMinimize', 'highFloatCompact');
    initMarketFloat('lowFloat', 'lowMinimize', 'lowFloatCompact');
    initMarketFloat('volumeFloat', 'volumeMinimize', 'volumeFloatCompact');
    updateSideFloatWidths();
    window.addEventListener('resize', scheduleSideFloatWidthUpdate);
    // 表格寫入後再量一次，避免初始 layout 未穩
    setTimeout(updateSideFloatWidths, 0);
    setTimeout(updateSideFloatWidths, 300);
    refreshSensorEvents();
    setInterval(refreshSensorEvents, 60 * 1000);
    updateClockEvent();
    setInterval(updateClockEvent, 60 * 1000);
    refreshTodoistEvents();
    setInterval(refreshTodoistEvents, 60 * 1000);
    refreshMarketBreakouts();
    setInterval(refreshMarketBreakouts, 60 * 1000);
    fetchAndUpdate();
    fetchAndUpdateBTC();
    /* Auto Reload */
    setTimeout(function () { window.location = window.location; }, 300000);
</script>
