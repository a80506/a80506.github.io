<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>DHT sendors</title>
    <style type="text/css">
        body {
            font-size: 60pt;
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #000000;
            height: 98%;
        }

        .top-space {
            height: 0%;
        }

        div {
            color: #80FF00;
            margin: 30px;
        }

        div.time {
            color: #FFFF00;
            font-size: 135pt;
            font-weight: bold;
        }

        div.coin {
            font-size: 90pt;
            color: #FFFFFF;
            font-weight: bold;
        }

        div.ethbtc {
            font-size: 75pt;
            font-weight: bold;
            color: #FFFFFF;
        }

        div.weather {
            font-size: 60pt;
            font-weight: bold;
            color: #FFFFFF;
        }

        div.nasdaq {
            font-size: 90pt;
            font-weight: bold;
            color: #80FF00;
        }

        div.rain {
            font-size: 60pt;
            font-weight: bold;
            color: red;
        }
    </style>
    <style type="text/css"></style>
    <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ="
        crossorigin="anonymous"></script>
    <script src="config.js"></script>
</head>

<body>
    <div class="top-space"></div>
    <div class="room2" align="center" style="display: none;">臥室：00°C, 00%</div>
    <div class="living_room" align="center">客廳：00°C, 0%</div>
    <div class="room1" align="center">書房：00°C, 00%</div>
    <div class="balcony" align="center">陽台：00°C, 00%</div>
    <div class="kids" align="center">房間：00°C, 00%</div>
    <div class="master-bedroom" align="center">主臥：00°C, 00%</div>
    <div class="pm25" align="center">PM2.5：0 ug/m3</div>
    <div class="rain" align="center" style="display: none;"></div>
    <div class="weather" align="center">戶外：00°C, 0%</div>
    <div class="time" align="center">00:00:00</div>
    <!--<div id="ethbtc" class="ethbtc" align="center">　</div> -->
    <div id="coin" class="coin" align="center">　</div>
    <div class="nasdaq" id="nasdaqDataContainer" align="center"></div>
    <div align="center">　</div>

    <script>
        // Each source owns one timer. Requests finish (or time out) before rescheduling.
        (function () {
            'use strict';

            const green = '#80FF00';
            const gray = '#444444';
            const minute = 60000;
            const sensorMaxAge = 30 * minute;
            const readings = {};
            const tasks = [];
            let weatherEmoji = '';
            let ethereumTVL = null;
            let nasdaq = null;

            function requestJSON(url) {
                return new Promise(function (resolve, reject) {
                    $.ajax({ url: url, dataType: 'json', timeout: 15000, cache: false })
                        .done(resolve)
                        .fail(function (_xhr, status) {
                            // Do not log URLs containing API keys.
                            reject(new Error(status === 'timeout' ? '連線逾時' : '讀取失敗'));
                        });
                });
            }

            function number(value) {
                return value == null || String(value).trim() === '' ? NaN : Number(value);
            }

            function fresh(timestamp, maxAge) {
                const age = Date.now() - Date.parse(timestamp);
                return Number.isFinite(age) && age >= 0 && age <= maxAge;
            }

            function schedule(name, interval, update) {
                const task = { name: name, interval: interval, update: update,
                    running: false, timer: null };
                tasks.push(task);
                return task;
            }

            async function run(task) {
                if (task.running) return;
                clearTimeout(task.timer);
                task.running = true;
                try {
                    await task.update();
                } catch (_error) {
                    // Preserve the display and retry without adding on-screen messages.
                } finally {
                    task.running = false;
                    task.timer = setTimeout(function () { run(task); }, task.interval);
                }
            }

            function refreshAll() {
                tasks.forEach(function (task) { run(task); });
            }

            const rooms = [
                { selector: '.living_room', name: '客廳', temp: 'field1', humidity: 'field2' },
                { selector: '.room1', name: '書房', temp: 'field7', humidity: 'field8' },
                { selector: '.balcony', name: '陽台', temp: 'field5', humidity: 'field6' },
                { selector: '.kids', name: '房間', temp: 'field3', humidity: 'field4' },
                { selector: '.master-bedroom', name: '主臥', temp: 'field7', humidity: 'field8' }
            ];

            function renderSensors() {
                rooms.forEach(function (room) {
                    const reading = readings[room.selector];
                    const element = $(room.selector);
                    if (!reading || !fresh(reading.time, sensorMaxAge)) {
                        element.css({ color: gray, 'font-weight': 'normal' });
                        return;
                    }
                    const temp = reading.temp;
                    const humidity = reading.humidity;
                    let color = green;
                    let bold = false;
                    if (humidity === 0) color = gray;
                    else if (room.selector === '.kids') {
                        color = temp > 29 ? 'red' : temp > 27 ? 'pink' : green;
                        bold = temp > 29;
                    } else {
                        const limit = room.selector === '.balcony' ? 90 : 80;
                        color = humidity >= limit ? 'red' : humidity >= limit - 10 ? 'orange' : green;
                        bold = humidity >= limit;
                    }
                    element.text(room.selector === '.room1' && (temp > 50 || temp < 0) ?
                        '書房：error' : room.name + '：' + temp + '°C, ' + humidity + '%')
                        .css({ color: color, 'font-weight': bold ? 'bold' : 'normal' });
                });
                const living = readings['.living_room'];
                const alert = living && fresh(living.time, sensorMaxAge) && living.humidity >= 80;
                $('.living_room').toggle(Boolean(alert));
                $('.time').toggle(!alert);
            }

            async function updateSensors(channel, selectedRooms) {
                const data = await requestJSON('https://api.thingspeak.com/channels/' + channel + '/feeds.json?results=20');
                if (!Array.isArray(data.feeds)) throw new Error('資料格式錯誤');
                selectedRooms.forEach(function (room) {
                    const latest = data.feeds.filter(function (feed) {
                        const temp = number(feed[room.temp]);
                        const humidity = number(feed[room.humidity]);
                        return fresh(feed.created_at, sensorMaxAge) && Number.isFinite(temp) &&
                            Number.isFinite(humidity);
                    }).sort(function (a, b) { return Date.parse(b.created_at) - Date.parse(a.created_at); })[0];
                    readings[room.selector] = latest ? {
                        time: latest.created_at, temp: Math.trunc(number(latest[room.temp])),
                        humidity: Math.trunc(number(latest[room.humidity]))
                    } : null;
                });
                renderSensors();
            }

            async function updateCoin() {
                try {
                    const data = await requestJSON('https://api.binance.com/api/v3/ticker/24hr');
                    const btc = data.find(function (item) { return item.symbol === 'BTCUSDT'; });
                    const eth = data.find(function (item) { return item.symbol === 'ETHUSDT'; });
                    if (!btc || !eth || !(number(btc.lastPrice) > 0) || !(number(eth.lastPrice) > 0) ||
                        !Number.isFinite(number(eth.priceChange))) throw new Error('幣價資料無效');
                    const price = Math.trunc(number(btc.lastPrice));
                    $('.coin').text((price >= 100000 ? (price / 1000).toFixed(3) : price) + ' / ' + Math.trunc(number(eth.lastPrice)))
                        .css('color', number(eth.priceChange) < 0 ? 'red' : green);
                } catch (_error) {
                    // Fallback is part of this update, never a second polling loop.
                    const data = await requestJSON('https://www.bitstamp.net/api/ticker');
                    const price = Math.trunc(number(data.last));
                    const open = Math.trunc(number(data.open));
                    if (!(price > 0) || !(open > 0)) throw new Error('備援幣價無效');
                    let percent = (price - open) / open * 100;
                    if (Number(percent.toFixed(1)) === 0) percent = 0;
                    const percentText = (percent > 0 ? '+' : '') +
                        ((price >= 10000 && percent >= 10) || percent <= -10 ? Math.trunc(percent) : percent.toFixed(1)) + '%';
                    $('.coin').text(String(price) + (percent ? ' (' + percentText + ')' : ''))
                        .css('color', percent === 0 ? 'orange' : percent > 0 ? 'red' : green);
                }
            }

            async function updatePM25() {
                const data = await requestJSON('https://data.moenv.gov.tw/api/v2/aqx_p_432?api_key=' + CONFIG.MOENV_KEY + '&format=JSON');
                const records = Array.isArray(data) ? data : data.records;
                if (!Array.isArray(records)) throw new Error('空品資料格式錯誤');
                for (const city of ['新莊', '林口', '菜寮', '五股', '蘆洲', '板橋']) {
                    const record = records.find(function (item) {
                        return item.sitename === city && Number.isFinite(number(item['pm2.5'])) && number(item['pm2.5']) >= 0;
                    });
                    if (!record) continue;
                    const value = number(record['pm2.5']);
                    $('.pm25').text(city + ' PM2.5：' + value)
                        .css({ color: value > 40 ? 'red' : value > 20 ? 'orange' : green,
                            'font-weight': value > 20 ? 'bold' : 'normal' });
                    return;
                }
                throw new Error('無有效空品資料');
            }

            async function updateWeatherEmoji() {
                const data = await requestJSON('https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0003-001?Authorization=' + CONFIG.CWB_APIKEY + '&StationId=466920');
                const weather = data.records.Station[0].WeatherElement.Weather;
                const hours = new Date().getHours();
                weatherEmoji = weather.includes('晴') ? (hours > 5 && hours < 18 ? '☀️' : '🌙') :
                    weather.includes('雨') ? '🌧️' : weather.includes('陰') ? '☁️' : weather.includes('多雲') ? '🌥️' : '';
                renderWeather();
            }

            let weatherReading = null;
            function renderWeather() {
                if (!weatherReading || !fresh(weatherReading.time, 90 * minute)) {
                    $('.weather').css({ color: gray, 'font-weight': 'normal' });
                    return;
                }
                const reading = weatherReading;
                const extreme = reading.temp >= 32 || reading.temp < 15;
                const warm = reading.temp > 28 || reading.temp < 20;
                $('.weather').text((reading.station === '新莊' ? weatherEmoji + ' ' : reading.station + '：') +
                    reading.temp + '°C, ' + Math.trunc(reading.humidity) + '% ' + weatherEmoji)
                    .css({ color: extreme ? 'red' : warm ? 'orange' : reading.humidity >= 80 ? '#46a3ff' : '#FFFFFF',
                        'font-weight': 'bold' });
            }

            async function updateWeather() {
                const data = await requestJSON('https://opendata.cwa.gov.tw/fileapi/v1/opendataapi/O-A0001-001?Authorization=' + CONFIG.CWB_APIKEY + '&downloadType=WEB&format=JSON');
                const stations = data.cwaopendata.dataset.Station;
                for (const city of ['新莊', '三重', '五股', '蘆洲', '板橋']) {
                    const station = stations.find(function (item) {
                        return item.StationName === city && fresh(item.ObsTime.DateTime, 90 * minute) &&
                            Number.isFinite(number(item.WeatherElement.AirTemperature)) && number(item.WeatherElement.AirTemperature) > -10 &&
                            number(item.WeatherElement.RelativeHumidity) > 0 && number(item.WeatherElement.RelativeHumidity) <= 100;
                    });
                    if (!station) continue;
                    weatherReading = { station: city, time: station.ObsTime.DateTime,
                        temp: number(station.WeatherElement.AirTemperature), humidity: number(station.WeatherElement.RelativeHumidity) };
                    renderWeather();
                    return;
                }
                weatherReading = null;
                renderWeather();
                throw new Error('無近期天氣資料');
            }

            function renderNasdaq() {
                if (!nasdaq) return;
                const first = ethereumTVL ? Math.trunc(ethereumTVL.value) : nasdaq.latest_price;
                const stale = fresh(nasdaq.time, 30 * minute) ? '' : '*';
                const vix = first === 111 ? '**' : nasdaq.price_change_percent_vix;
                $('#nasdaqDataContainer').text(first + ' / ' + (nasdaq.price_change > 0 ? '+' : '') +
                    nasdaq.price_change + ' ' + stale + ' / ' + vix).css('color', nasdaq.price_change > 0 ? green : 'red');
            }

            async function updateNasdaq() {
                const data = await requestJSON('https://' + CONFIG.MYSITE + '/linepic/nasdaq.json');
                if (!Number.isFinite(number(data.latest_price)) || !Number.isFinite(number(data.price_change)) ||
                    !Number.isFinite(Date.parse(data.time)) || data.price_change_percent_vix == null) throw new Error('行情資料無效');
                nasdaq = data;
                renderNasdaq();
            }

            async function updateTVL() {
                const data = await requestJSON('https://api.llama.fi/v2/chains');
                const chain = data.find(function (item) { return item.name.toLowerCase() === 'ethereum'; });
                if (!chain || !(number(chain.tvl) > 0)) throw new Error('TVL 資料無效');
                ethereumTVL = { value: number(chain.tvl) / 1e9, time: Date.now() };
                renderNasdaq();
            }

            async function updateRain() {
                const data = await requestJSON('https://' + CONFIG.MYSITE + '/linepic/rain.json');
                if (!Array.isArray(data.rain_periods)) throw new Error('降雨資料格式錯誤');
                const rain = data.rain_periods.find(function (period) {
                    return typeof period.weather_description === 'string' && period.weather_description.includes('雨');
                });
                if (rain) $('.rain').text(rain.time + ' ' + rain.weather_description + ' ' + rain.probability + '%');
                $('.rain').toggle(Boolean(rain));
                $('.kids').toggle(!rain);
            }

            schedule('感測器', minute, function () { return updateSensors('72313', rooms.slice(0, 4)); });
            schedule('主臥', minute, function () { return updateSensors('565880', rooms.slice(4)); });
            schedule('幣價', minute, updateCoin);
            schedule('PM2.5', 5 * minute, updatePM25);
            schedule('天氣圖示', 5 * minute, updateWeatherEmoji);
            schedule('天氣', 5 * minute, updateWeather);
            schedule('Nasdaq', 5 * minute, updateNasdaq);
            schedule('TVL', 5 * minute, updateTVL);
            schedule('降雨', 5 * minute, updateRain);

            function tick() {
                $('.time').text(new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' }));
                renderSensors();
                renderWeather();
                renderNasdaq();
            }
            tick();
            setInterval(tick, 1000);
            refreshAll();
            window.addEventListener('online', refreshAll);
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) {
                    tick();
                    refreshAll();
                }
            });
        }());
    </script>
</body>
</html>
